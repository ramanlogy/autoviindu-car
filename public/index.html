      border: 3px solid #fff;
      box-shadow: 0 1px 4px rgba(26, 107, 42, .3);
      cursor: pointer
    }

    /* ── Mobile bottom sticky bar ── */
    .dp-mob-bar {
      display: flex;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--white);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      gap: 8px;
      z-index: 100;
      align-items: center
    }

    @media(min-width:900px) {
      .dp-mob-bar {
        display: none
      }
    }

    .dp-mob-price {
      flex: 1
    }

    .dp-mob-price-lbl {
      font-size: 10px;
      color: var(--ink4);
      font-weight: 600
    }

    .dp-mob-price-val {
      font-family: var(--font-d);
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.2
    }

    .dp-mob-btns {
      display: flex;
      gap: 7px
    }

    .dp-mob-btn-p {
      padding: 10px 16px;
      background: var(--g3);
      color: #fff;
      border: none;
      border-radius: var(--r8);
      font-family: var(--font-b);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap
    }

    .dp-mob-btn-g {
      padding: 10px 16px;
      background: var(--gold);
      color: #fff;
      border: none;
      border-radius: var(--r8);
      font-family: var(--font-b);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap
    }

    /* ── Mobile-only EMI accordion ── */
    .dp-mob-emi-acc {
      display: block
    }

    @media(min-width:900px) {
      .dp-mob-emi-acc {
        display: none
      }
    }

    /* ── Similar / highlights ── */
    .dp-similar {
      padding: 20px 16px;
      background: var(--white);
      border-top: 1px solid var(--border)
    }

    @media(min-width:900px) {
      .dp-similar {
        border: 1px solid var(--border);
        border-radius: var(--r16);
        overflow: hidden
      }
    }

    .section-hd {
      font-family: var(--font-d);
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 14px
    }

    .dp-hl-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .dp-hl-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f8fafc;
      border: 1px solid var(--border);
      color: var(--ink2);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .dp-hl-tag:hover {
      background: #eef7f0;
      border-color: rgba(26,107,42,0.3);
      color: var(--g3);
      transform: translateY(-1px);
    }

    /* ══ MOBILE MENU ══ */
    .mobile-menu {
      position: fixed;
      inset: 0;
      top: var(--nav);
      z-index: 850;
      /* stays mounted so the panel slides back up on close */
      visibility: hidden;
      pointer-events: none;
      transition: visibility 0s linear .26s;
    }

    .mobile-menu.open {
      visibility: visible;
      pointer-events: auto;
      transition: visibility 0s;
    }

    .mm-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(7, 16, 10, .55);
      backdrop-filter: blur(8px);
      opacity: 0;
      transition: opacity var(--dur-3) ease;
    }

    .mobile-menu.open .mm-backdrop { opacity: 1; }

    .mm-panel {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      max-height: calc(100vh - var(--nav));
      overflow-y: auto;
      transform: translateY(-10px);
      opacity: 0;
      transition: transform var(--ease-out), opacity var(--ease-out);
    }

    .mobile-menu.open .mm-panel {
      transform: translateY(0);
      opacity: 1;
    }

    .mm-search {
      padding: 14px;
      border-bottom: 1px solid var(--bg2)
    }

    .mm-search-box {
      display: flex;
      align-items: center;
      border: 1.5px solid var(--border);
      border-radius: var(--pill);
      background: var(--bg);
      overflow: hidden
    }


    .mm-search-box svg {
      margin: 0 10px;
      color: var(--ink4);
      flex-shrink: 0
    }

    .mm-search-box input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 14px;
      padding: 10px 0;
      outline: none;
      font-family: var(--font-b)
    }

    .mm-search-box button {
      margin: 4px;
      padding: 7px 16px;
      background: var(--g3);
      color: #fff;
      border-radius: var(--pill);
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
      font-family: var(--font-b)
    }

    .mm-item {
      border-bottom: 1px solid var(--bg2)
    }

    .mm-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 700;
      color: var(--ink2);
      background: none;
      text-align: left;
      cursor: pointer;
      font-family: var(--font-b)
    }

    .mm-sub {
      display: none;
      padding: 0 0 8px 16px;
      background: var(--bg)
    }

    .mm-sub.open {
      display: block
    }

    .mm-sub-link {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 12px;
      border-radius: var(--r8);
      cursor: pointer;
      transition: all var(--ease);
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ink2)
    }

    .mm-sub-link:hover {
      background: var(--g-ll);
      color: var(--g3)
    }

    .mm-cta {
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      border-top: 1px solid var(--bg2)
    }

    /* ══ COMPARE PAGE ══ */
    .compare-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      padding: 32px 0 64px
    }

    @media(min-width:980px) {
      .compare-layout {
        grid-template-columns: 280px 1fr;
        gap: 28px
      }
    }

    .cmp-picker-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--ink);
      margin-bottom: 12px
    }

    .cmp-car-pick {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      background: var(--white);
      border-radius: var(--r10);
      cursor: pointer;
      transition: all var(--ease);
      margin-bottom: 7px
    }

    .cmp-car-pick:hover {
      border-color: var(--g3);
      background: var(--g-ll)
    }

    .cmp-car-pick.in {
      border-color: var(--g3);
      background: var(--g-ll)
    }

    .cmp-car-pick img {
      width: 46px;
      height: 30px;
      object-fit: cover;
      border-radius: var(--r6);
      flex-shrink: 0
    }

    .cmp-car-pick-name {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .cmp-car-pick-price {
      font-size: 11px;
      color: var(--ink4)
    }

    /* ══ USED CARS ══ */
    .used-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px
    }

    @media(min-width:600px) {
      .used-grid {
        gap: 14px
      }
    }

    @media(min-width:900px) {
      .used-grid {
        grid-template-columns: repeat(3, 1fr)
      }
    }

    @media(min-width:1100px) {
      .used-grid {
        grid-template-columns: repeat(4, 1fr)
      }
    }

    .used-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--r16);
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: all .25s cubic-bezier(.4, 0, .2, 1)
    }

    .used-card:hover {
      box-shadow: var(--sh3);
      transform: translateY(-4px);
      border-color: rgba(26, 107, 42, .2)
    }

    .used-card:hover .uc-img img {
      transform: scale(1.07)
    }

    .uc-img {
      position: relative;
      height: 160px;
      overflow: hidden;
      background: linear-gradient(135deg, var(--bg2), var(--bg3));
      flex-shrink: 0
    }

    @media(min-width:480px) {
      .uc-img {
        height: 178px
      }
    }

    @media(min-width:768px) {
      .uc-img {
        height: 200px
      }
    }

    .uc-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .5s cubic-bezier(.4, 0, .2, 1)
    }

    .uc-badges {
      position: absolute;
      top: 8px;
      left: 8px;
      display: flex;
      gap: 4px;
      flex-wrap: wrap
    }

    .uc-badge {
      font-size: 9.5px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: var(--pill);
      text-transform: uppercase;
      letter-spacing: .3px
    }

    .uc-badge-cert {
      background: var(--g3);
      color: #fff
    }

    .uc-badge-fuel {
      background: var(--ink2);
      color: #fff
    }

    .uc-badge-owner {
      background: #7c3aed;
      color: #fff
    }

    .uc-badge-low {
      background: var(--gold);
      color: #fff
    }

    .uc-wish {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 30px;
      height: 30px;
      background: rgba(255, 255, 255, .92);
      backdrop-filter: blur(6px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--ease)
    }

    .uc-wish:hover {
      transform: scale(1.1)
    }

    .uc-wish.active svg {
      stroke: #ef4444;
      fill: #ef4444
    }

    .uc-km {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(7, 16, 10, .72);
      backdrop-filter: blur(6px);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: var(--pill);
      display: flex;
      align-items: center;
      gap: 3px
    }

    .uc-body {
      padding: 12px;
      flex: 1;
      display: flex;
      flex-direction: column
    }

    @media(min-width:480px) {
      .uc-body {
        padding: 14px
      }
    }

    .uc-meta-top {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 5px
    }

    .uc-rating {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: var(--g3);
      color: #fff;
      padding: 2px 7px;
      border-radius: var(--pill);
      font-size: 10.5px;
      font-weight: 800
    }

    .uc-year {
      font-size: 11px;
      color: var(--ink4)
    }

    .uc-name {
      font-family: var(--font-d);
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.25
    }

    @media(min-width:768px) {
      .uc-name {
        font-size: 16.5px
      }
    }

    .uc-variant {
      font-size: 11.5px;
      color: var(--ink4);
      margin-top: 2px;
      margin-bottom: 8px
    }

    .uc-specs {
      display: none;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 9px
    }

    @media(min-width:480px) {
      .uc-specs {
        display: flex
      }
    }

    .uc-spec-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--pill);
      padding: 3px 9px;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--ink3)
    }

    .uc-price-row {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--bg2)
    }

    .uc-from {
      font-size: 9.5px;
      font-weight: 700;
      color: var(--ink4);
      text-transform: uppercase;
      letter-spacing: .4px;
      margin-bottom: 2px
    }

    .uc-price {
      font-family: var(--font-d);
      font-size: 17px;
      font-weight: 700;
      color: var(--g3);
      line-height: 1
    }

    @media(min-width:768px) {
      .uc-price {
        font-size: 19px
      }
    }

    .uc-emi {
      font-size: 10.5px;
      color: var(--ink4);
      margin-top: 3px
    }

    .uc-emi strong {
      color: #059669;
      font-weight: 700
    }

    .uc-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 10px
    }

    .uc-btn-o {
      padding: 8px 4px;
      border: 1.5px solid var(--g3);
      color: var(--g3);
      background: var(--white);
      border-radius: var(--r8);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--ease);
      text-align: center;
      font-family: var(--font-b)
    }

    .uc-btn-o:hover {
      background: var(--g3);
      color: #fff
    }

    .uc-btn-f {
      padding: 8px 4px;
      background: var(--g3);
      color: #fff;
      border-radius: var(--r8);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background var(--ease);
      text-align: center;
      font-family: var(--font-b)
    }

    .uc-btn-f:hover {
      background: var(--g4)
    }

    .uc-trust-strip {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 18px
    }

    @media(min-width:540px) {
      .uc-trust-strip {
        grid-template-columns: repeat(4, 1fr)
      }
    }

    .uc-trust-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: var(--g-ll);
      border: 1px solid rgba(26, 107, 42, .14);
      border-radius: var(--r10)
    }

    .uc-trust-icon {
      width: 28px;
      height: 28px;
      background: var(--g3);
      border-radius: var(--r8);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0
    }

    .uc-trust-title {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--ink2)
    }

    .uc-trust-sub {
      font-size: 10px;
      color: var(--ink4);
      margin-top: 1px
    }

    .uc-check-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px
    }

    @media(min-width:540px) {
      .uc-check-grid {
        grid-template-columns: repeat(3, 1fr)
      }
    }

    .uc-check-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 9px 11px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r8)
    }

    .uc-check-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0
    }

    .uc-check-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink2)
    }

    .uc-check-status {
      font-size: 10px;
      color: var(--ink4);
      margin-left: auto;
      font-weight: 700
    }

    .uc-seller-card {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--r16);
      padding: 18px
    }

    .uc-seller-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px
    }

    .uc-seller-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--g3), var(--g4));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-d);
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0
    }

    .uc-seller-name {
      font-size: 14px;
      font-weight: 800;
      color: var(--ink)
    }

    .uc-seller-badge {
      font-size: 10px;
      font-weight: 700;
      color: var(--g3);
      background: var(--g-ll);
      border: 1px solid rgba(26, 107, 42, .2);
      border-radius: var(--pill);
      padding: 2px 7px;
      display: inline-block;
      margin-top: 2px
    }

    .uc-seller-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 14px
    }

    .uc-ss-cell {
      text-align: center;
      padding: 8px;
      background: var(--bg);
      border-radius: var(--r8)
    }

    .uc-ss-val {
      font-family: var(--font-d);
      font-size: 14px;
      font-weight: 700;
      color: var(--g3)
    }

    .uc-ss-lbl {
      font-size: 9.5px;
      color: var(--ink4);
      margin-top: 1px
    }

    /* ══ CTA BANNER ══ */
    .cta-banner {
      background: linear-gradient(135deg, #040b06, #07120a);
      border-radius: var(--r24);
      padding: 40px 24px;
      position: relative;
      overflow: hidden;
      text-align: center
    }

    .cta-banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 600px 300px at 50% 50%, rgba(26, 107, 42, .12), transparent);
      pointer-events: none
    }

    .cta-banner::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, .02) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none
    }

    .cta-in {
      position: relative;
      z-index: 1
    }

    .cta-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--g5);
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 10px
    }

    .cta-title {
      font-family: var(--font-d);
      font-size: clamp(24px, 4vw, 38px);
      color: #fff;
      margin-bottom: 12px;
      line-height: 1.1;
      font-weight: 700
    }

    .cta-sub {
      font-size: 14px;
      color: rgba(255, 255, 255, .38);
      margin-bottom: 24px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.7
    }

    .cta-btns {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap
    }

    /* ══ DESKTOP NAV — click menus, no overlay ══ */
    .header-nav .av-item {
      position: relative;
    }

    .header-nav .av-link {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 8px 11px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ink3);
      cursor: pointer;
      white-space: nowrap;
      border: none;
      background: none;
      border-radius: var(--r8);
      font-family: var(--font-b);
      transition: color .15s, background .15s;
      user-select: none;
    }

    .header-nav .av-link:hover,
    .header-nav .av-item.open>.av-link {
      color: var(--g3);
      background: var(--g-ll);
    }

    .header-nav .av-chev {
      width: 10px;
      height: 6px;
      opacity: .45;
      transition: transform .2s;
      flex-shrink: 0;
    }

    .header-nav .av-item.open>.av-link .av-chev {
      transform: rotate(180deg);
    }

    .header-nav .av-dd {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      min-width: 232px;
      max-width: 268px;
      max-height: min(72vh, 480px);
      overflow-y: auto;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--r12);
      box-shadow: 0 10px 36px rgba(0, 0, 0, .1);
      z-index: 999;
      padding: 6px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(6px);
      pointer-events: none;
      transition: opacity .18s, transform .18s, visibility .18s;
    }

    .header-nav .av-dd.av-dd--r {
      left: auto;
      right: 0;
    }

    .header-nav .av-item.open>.av-dd {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      pointer-events: auto;
    }

    .header-nav .av-acc {
      border-radius: var(--r8);
    }

    .header-nav .av-acc-hd {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 9px 11px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink2);
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font-b);
      border-radius: var(--r8);
      transition: background .12s, color .12s;
    }

    .header-nav .av-acc-hd:hover,
    .header-nav .av-acc.open>.av-acc-hd {
      background: var(--g-ll);
      color: var(--g3);
    }

    .header-nav .av-acc-chev {
      width: 14px;
      height: 14px;
      opacity: .35;
      transition: transform .2s;
      flex-shrink: 0;
    }

    .header-nav .av-acc.open>.av-acc-hd .av-acc-chev {
      transform: rotate(90deg);
      opacity: .6;
    }

    .header-nav .av-acc-body {
      display: none;
      padding: 0 4px 6px;
    }

    .header-nav .av-acc.open .av-acc-body {
      display: block;
    }

    .header-nav .av-menu-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 11px 7px 18px;
      font-size: 12.5px;
      font-weight: 600;
      color: #060606;
      text-decoration: none;
      border-radius: var(--r8);
      transition: background .12s, color .12s;
      cursor: pointer;
    }

    .header-nav .av-menu-link:hover {
      background: var(--bg2);
      color: var(--g3);
    }

    .header-nav .av-tag {
      font-size: 9.5px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: .02em;
      flex-shrink: 0;
    }

    .header-nav .av-tag--g {
      background: #d6f2e7;
      color: #0d6b4f;
    }

    .header-nav .av-tag--o {
      background: #fde8d0;
      color: #7d4310;
    }

    .header-nav .av-menu-cta {
      display: block;
      margin-top: 4px;
      padding: 10px 11px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--g3);
      text-decoration: none;
      border-top: 1px solid var(--border);
      border-radius: 0 0 var(--r8) var(--r8);
      cursor: pointer;
      transition: background .12s;
    }

    .header-nav .av-menu-cta:hover {
      background: var(--g-ll);
    }

    .header-nav .av-cta {
      margin-left: 6px;
      flex-shrink: 0;
      background: var(--g3);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: var(--r8);
      border: none;
      cursor: pointer;
      font-family: var(--font-b);
      transition: background .15s;
    }

    .header-nav .av-cta:hover {
      background: var(--g4);
    }

    /* ══ SERVICES SECTION ══ */
    .svc-section {
      background: #f5f7f5;
      padding: 72px 0
    }

    .svc-hd {
      text-align: center;
      margin-bottom: 48px
    }

    .svc-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--g3);
      margin-bottom: 12px
    }

    .svc-eyebrow::before,
    .svc-eyebrow::after {
      content: '';
      display: block;
      width: 28px;
      height: 2px;
      background: var(--g3);
      border-radius: 2px
    }

    .svc-title {
      font-family: var(--font-d);
      font-size: clamp(24px, 3.5vw, 36px);
      font-weight: 700;
      color: #111;
      line-height: 1.15;
      margin-bottom: 10px
    }

    .svc-sub {
      font-size: 14px;
      color: #666;
      max-width: 520px;
      margin: 0 auto;
      line-height: 1.6
    }

    .svc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      background: none;
      border-radius: 0;
      overflow: visible
    }

    .svc-card {
      background: #fff;
      border: 1px solid #e8ede9;
      border-radius: 16px;
      padding: 28px 24px;
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      transition: box-shadow .2s ease, border-color .2s ease, transform .2s ease
    }

    .svc-card:hover {
      box-shadow: 0 8px 32px rgba(26, 107, 42, .1);
      border-color: rgba(26, 107, 42, .3);
      transform: translateY(-2px)
    }

    .svc-arr {
      display: none
    }

    .svc-icon {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: #f0f7f1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      flex-shrink: 0
    }

    .svc-name {
      font-size: 16px;
      font-weight: 700;
      color: #111;
      margin-bottom: 8px;
      line-height: 1.3
    }

    .svc-desc {
      font-size: 13px;
      color: #777;
      line-height: 1.65;
      margin-bottom: 20px;
      flex: 1
    }

    .svc-learn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 700;
      color: var(--g3);
      text-decoration: none;
      margin-top: auto
    }

    .svc-learn:hover {
      gap: 7px
    }

    .svc-learn svg {
      transition: transform .2s ease
    }

    .svc-learn:hover svg {
      transform: translateX(2px)
    }

    .svc-tags,
    .svc-cta-h,
    .svc-cta-checks,
    .svc-btn-primary,
    .svc-btn-ghost,
    .svc-hours,
    .svc-footer-row,
    .svc-stats {
      display: none
    }

    @media(max-width:639px) {
      .svc-grid {
        grid-template-columns: 1fr;
        gap: 12px
      }
    }

    @media(min-width:640px) and (max-width:959px) {
      .svc-grid {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      }
    }

    @media(min-width:960px) {

      .svc-card:nth-child(1),
      .svc-card:nth-child(2),
      .svc-card:nth-child(3),
      .svc-card:nth-child(4),
      .svc-card:nth-child(5) {
        grid-column: auto;
        grid-row: auto
      }
    }

    /* ══ OFFERS REDESIGN ══ */
    .offers-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px
    }

    @media(max-width:900px) {
      .offers-grid {
        grid-template-columns: repeat(2, 1fr)
      }
    }

    @media(max-width:560px) {
      .offers-grid {
        grid-template-columns: 1fr
      }
    }

    .offer-card {
      background: rgba(235, 228, 228, .05);
      border: 1px solid rgba(255, 255, 255, .09);
      border-radius: var(--r16);
      padding: 22px;
      display: flex;
      flex-direction: column;
      min-height: 200px;
      cursor: pointer;
      transition: all var(--ease)
    }

    .offer-card:hover {
      background: rgba(255, 255, 255, .09);
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, .16)
    }

    .offer-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
      line-height: 1.3
    }

    .offer-desc {
      font-size: 12.5px;
      color: rgba(255, 255, 255, .38);
      line-height: 1.65
    }

    .offer-tag {
      font-size: 10px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: var(--pill);
      text-transform: uppercase;
      letter-spacing: .4px;
      white-space: nowrap;
      align-self: flex-start
    }

    .sec-title {
      color: #3d3d3d
    }

    /* ══ MISC ══ */
    @keyframes carDrive {
      0% {
        transform: translateX(-200px);
        opacity: .6
      }

      50% {
        transform: translateX(200px);
        opacity: 1
      }

      100% {
        transform: translateX(-200px);
        opacity: .6
      }
    }

    .car-icon-wrap {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--brand);
      animation: carDrive 16s ease-in-out infinite
    }

    .logo-mark {
      background: none;
      border: none;
      padding: 0;
      border-radius: 0;
      box-shadow: none
    }

    .logo {
      display: flex;
      align-items: center;
      cursor: pointer;
      margin-left: 0
    }

    .footer-logo-img {
      height: 120px;
      width: auto;
      display: block;
      object-fit: contain;
      background: transparent
    }

    @media(max-width:768px) {
      .footer-logo-img {
        height: 90px
      }
    }

    .mm-sub {
      max-height: 0;
      overflow: hidden;
      transition: max-height .3s ease, padding .3s ease
    }

    .mm-sub.open {
      max-height: 600px;
      padding: 4px 0 8px
    }

    .mm-btn svg.mm-chevron {
      transition: transform .25s ease;
      flex-shrink: 0
    }

    .mm-btn.open svg.mm-chevron {
      transform: rotate(90deg)
    }

    #form-area {
      animation: fadeUp .35s ease both
    }

    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-60px)
      }

      to {
        opacity: 1;
        transform: translateX(0)
      }
    }

    .logo-img {
      height: 46px;
      width: auto;
      display: block;
      object-fit: contain;
      background: transparent;
      animation: slideInLeft .6s cubic-bezier(.25, .46, .45, .94) forwards
    }

    @media(min-width: 960px) {
      .logo-img {
        height: 56px;
      }
    }


    /* ══ ANIMATIONS ══ */
    @keyframes fadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
        opacity: 0
      }

      to {
        transform: translateY(0);
        opacity: 1
      }
    }

    @keyframes slideDown {
      from {
        transform: translateY(-10px);
        opacity: 0
      }

      to {
        transform: translateY(0);
        opacity: 1
      }
    }

    @keyframes slideRight {
      from {
        transform: translateX(120%);
        opacity: 0
      }

      to {
        transform: translateX(0);
        opacity: 1
      }
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
        transform: scale(1)
      }

      50% {
        opacity: .3;
        transform: scale(.7)
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    @keyframes shimmer {
      0% {
        background-position: -200% 0
      }

      100% {
        background-position: 200% 0
      }
    }

    .hidden {
      display: none !important
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0)
    }


    /* ══════════════════════════════════════
   ══ MODERN EVENTS SECTION  ══
   ══════════════════════════════════════ */
    .events-section-modern {
      background: var(--bg);
      padding: 80px 0;
      overflow: hidden;
    }

    .ev-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 40px;
      gap: 20px;
      flex-wrap: wrap;
    }

    .ev-hd-left {
      max-width: 600px;
    }

    .ev-eyebrow {
      font-size: 13px;
      font-weight: 800;
      color: var(--brand);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
      display: inline-block;
      padding: 6px 12px;
      background: rgba(36, 160, 68, 0.1);
      border-radius: var(--pill);
    }

    .ev-title {
      font-family: var(--font-h);
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 800;
      color: rgb(197, 194, 194);
      line-height: 1.1;
      margin-bottom: 12px;
      letter-spacing: -1px;
    }

    .ev-sub {
      font-size: 16px;
      color: var(--ink3);
      line-height: 1.6;
    }

    .ev-btn-outline {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: var(--pill);
      border: 1.5px solid var(--border);
      background: var(--white);
      color: var(--ink);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .ev-btn-outline:hover {
      border-color: var(--brand);
      color: var(--brand);
      box-shadow: 0 4px 12px rgba(36, 160, 68, 0.1);
      transform: translateY(-2px);
    }

    .ev-modern-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    @media (max-width: 992px) {
      .ev-modern-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 640px) {
      .ev-modern-grid {
        grid-template-columns: 1fr;
      }
    }

    .ev-modern-card {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      aspect-ratio: 4/5;
      cursor: pointer;
      isolation: isolate;
    }

    .ev-modern-card.featured {
      grid-column: span 2;
      aspect-ratio: 2/1;
    }

    @media (max-width: 992px) {
      .ev-modern-card.featured {
        grid-column: span 2;
        aspect-ratio: 16/9;
      }
    }

    @media (max-width: 640px) {
      .ev-modern-card.featured {
        grid-column: span 1;
        aspect-ratio: 4/5;
      }

      .ev-modern-card {
        aspect-ratio: 4/5;
      }
    }

    .ev-card-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1;
    }

    .ev-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.6) 60%, rgba(0, 0, 0, 0.9) 100%);
      z-index: 2;
      transition: background 0.4s ease;
    }

    .ev-modern-card:hover .ev-card-bg {
      transform: scale(1.08);
    }

    .ev-modern-card:hover .ev-card-overlay {
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.2) 0%, rgba(0, 0, 0, 0.7) 50%, rgba(0, 0, 0, 0.95) 100%);
    }

    .ev-card-top {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      z-index: 3;
    }

    .ev-badge {
      padding: 6px 12px;
      border-radius: var(--pill);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .ev-badge.live {
      background: var(--brand);
      border-color: var(--brand);
    }

    .ev-badge.free {
      background: rgba(255, 255, 255, 0.9);
      color: var(--ink);
      border: none;
    }

    .ev-badge.invite {
      background: var(--ink);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .ev-card-content {
      position: absolute;
      bottom: 24px;
      left: 24px;
      right: 24px;
      z-index: 3;
      display: flex;
      gap: 16px;
      align-items: flex-end;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .ev-modern-card:hover .ev-card-content {
      transform: translateY(-50px);
    }

    .ev-date-box {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 64px;
      flex-shrink: 0;
    }

    .ev-day {
      font-family: var(--font-d);
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      line-height: 1;
      margin-bottom: 2px;
    }

    .ev-month {
      font-size: 12px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.8);
      letter-spacing: 1px;
    }

    .ev-info {
      flex: 1;
    }

    .ev-card-title {
      font-family: var(--font-h);

    /* Container Spacing */
    .hero-strip {
      padding: 20px 0;
      background: #ffffff;
    }

    .strip-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 10px 5px;
    }

    /* The Individual Item */
    .strip-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 100px;
      cursor: pointer;
      transition: all 0.3s ease;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid transparent;
      /* Keeps layout stable on hover */
    }

    /* Icon Wrapper - NO FILL */
    .strip-icon-wrapper {
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      color: #4b5563;
      /* Subtle Grey-Blue icon color */
      transition: color 0.3s ease;
    }

    /* Make SVG Strokes Thin and Clean */
    .strip-icon-wrapper svg {
      width: 48px;
      height: 48px;
      fill: none;
      /* Removes the heavy fill */
      stroke: currentColor;
      stroke-width: 1.5;
      /* Makes lines look professional/expert */
    }

    /* Label Styling */
    .strip-label {
      font-size: 13px;
      font-weight: 500;
      color: #374151;
      text-align: center;
    }

    /* PROFESSIONAL ACTIVE/HOVER STATE (Matches Image) */
    .strip-item:hover,
    .strip-item.active {
      background: #ffffff;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      /* Soft depth shadow */
      border-color: #e5e7eb;
    }

    .strip-item:hover .strip-icon-wrapper,
    .strip-item.active .strip-icon-wrapper {
      color: #15803d;
      /* Professional Green from your image */
    }

  <script>
    (function () {
      var hash = location.hash || '';
      // Deep-linked car detail page (refresh / shared link): show a skeleton
      // shaped like the detail page, not a grid of card skeletons.
      if ((hash.indexOf('#car/') === 0 || hash.indexOf('#used/') === 0) && window.AV_detailSkeleton) {
        document.getElementById('app-root').innerHTML = window.AV_detailSkeleton();
        return;
      }
      // Homepage: show a skeleton shaped like the real home layout (hero +
      // pill strip + section carousels), not a bare grid of card boxes.
      if ((hash === '' || hash === '#' || hash === '#home') && window.AV_homeSkeleton) {
        document.getElementById('app-root').innerHTML = window.AV_homeSkeleton();
        return;
      }
      var isUsed = hash === '#used';
      var cardClass = isUsed ? 'skel-used-card' : 'skel-car-card';
      var card = isUsed
        ? '<div class="' + cardClass + '"><div class="skel-img skel-block"></div><div class="skel-body">' +
          '<div class="skel-line skel-block w-50"></div>' +
          '<div class="skel-line skel-block w-85"></div>' +
          '<div class="skel-line skel-block w-50"></div>' +
          '<div class="skel-price-row"><div class="skel-line skel-block w-30"></div><div class="skel-btn skel-block"></div></div>' +
          '</div></div>'
        : '<div class="' + cardClass + '"><div class="skel-img skel-block"></div><div class="skel-body">' +
          '<div class="skel-line skel-block w-85"></div>' +
          '<div class="skel-line skel-block w-60"></div>' +
          '<div class="skel-line skel-block w-40"></div>' +
          '<div class="skel-btn skel-block"></div>' +
          '</div></div>';
      var grid = '<div class="' + (isUsed ? 'used-grid' : 'cars-grid') + '" style="padding:24px 16px;max-width:1280px;margin:0 auto">' +
        card.repeat(8) + '</div>';
      document.getElementById('app-root').innerHTML = grid;
    })();
    lucide.createIcons();
  </script>
