<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="assets/logo/favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/logo/favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/logo/favicon_io/favicon-16x16.png">
<meta charset="UTF-8">
  <link rel="stylesheet" href="assets/css/site-chrome.css">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>EV Charge Nepal — Find a charging station</title>
<meta name="description" content="Find EV charging stations across Nepal — NEA, BYD, Tata, CG Motors, Hyundai, ElectriVa, GadiCharge, Aircharge and more. Filter by brand, speed and plan a route.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --ink:#0D1210; --ink-2:#4A534E; --ink-3:#8B948E; --ink-4:#B7BEB9;
  --line:#E4E8E4; --line-2:#EDF0ED;
  --bg:#FFFFFF; --bg-soft:#F6F7F5; --bg-raise:#FFFFFF;
  --accent:#0F5C33; --accent-ink:#FFFFFF; --accent-soft:#E7F2EB; --accent-dim:#12703F;
  --amber:#A66A0E; --amber-soft:#FBF1E1;
  --grey-soft:#EEF0EE;
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(13,18,16,.06);
  --sh-2:0 8px 28px rgba(13,18,16,.14);
  --ease:cubic-bezier(.4,0,.2,1);
  --header-h:60px;
  --tabs-h:52px;
  font-size:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; line-height:1.5;
  overflow-x:hidden;
  overflow-y:auto;
}
::selection{background:var(--accent-soft);}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
button{font-family:inherit; cursor:pointer;}
input,select{font-family:inherit;}
a{color:inherit;}
svg.icon{width:16px;height:16px;stroke-width:2;flex-shrink:0;}

/* ============ APP SHELL ============ */
.app{ height:calc(100vh - var(--nav, 70px)); min-height:550px; display:flex; flex-direction:column; }

/* ---- Header ---- */
.topbar{
  height:var(--header-h); flex-shrink:0; display:flex; align-items:center; gap:14px;
  padding:0 18px; border-bottom:1px solid var(--line); background:var(--bg);
  z-index:50;
}
.brand{ display:flex; align-items:center; gap:9px; font-weight:800; font-size:15px; letter-spacing:-.01em; white-space:nowrap; }
.brand .bolt{
  width:26px; height:26px; border-radius:7px; background:var(--ink); color:#fff;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.brand .bolt svg{ width:15px; height:15px; }
.brand span.sub{ display:none; color:var(--ink-3); font-weight:500; }
.topbar-meta{
  display:flex; align-items:center; gap:16px; margin-left:auto; margin-right:auto;
  font-size:12.5px; color:var(--ink-3); font-weight:600; white-space:nowrap;
}
.topbar-meta b{ color:var(--ink); font-weight:800; }
.topbar-meta .dot{ width:3px; height:3px; border-radius:50%; background:var(--ink-4); }
@media(max-width:680px){ .topbar-meta{ display:none; } }

.btn{
  display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:var(--bg);
  color:var(--ink); font-weight:700; font-size:13px; padding:9px 14px; border-radius:var(--r-pill);
  transition:all .15s var(--ease); white-space:nowrap;
}
.btn:hover{ border-color:var(--ink-4); background:var(--bg-soft); }
.btn.primary{ background:var(--ink); border-color:var(--ink); color:#fff; }
.btn.primary:hover{ background:#000; }
.btn.accent{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.accent:hover{ background:var(--accent-dim); }
.btn.active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
.btn.ghost{ border-color:transparent; background:transparent; }
.btn.ghost:hover{ background:var(--bg-soft); }
.btn.sm{ padding:7px 11px; font-size:12px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }

/* ---- Route bar (collapsible) ---- */
.route-bar{
  flex-shrink:0; overflow:hidden; max-height:0; transition:max-height .28s var(--ease), border-color .2s;
  border-bottom:1px solid transparent; background:var(--bg-soft);
}
.route-bar.open{ max-height:160px; border-color:var(--line); }
.route-bar-inner{ display:flex; align-items:flex-end; gap:10px; padding:14px 18px; flex-wrap:wrap; }
.rfield{ display:flex; flex-direction:column; gap:5px; flex:1; min-width:150px; }
.rfield label{ font-size:10.5px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--ink-3); }
.rfield .box{
  display:flex; align-items:center; gap:8px; background:var(--bg); border:1.5px solid var(--line);
  border-radius:var(--r-sm); padding:9px 12px; transition:border-color .15s;
}
.rfield .box:focus-within{ border-color:var(--accent); }
.rfield .box svg{ color:var(--ink-3); flex-shrink:0; }
.rfield input{ border:none; outline:none; background:none; font-size:13.5px; width:100%; color:var(--ink); }
.rfield input::placeholder{ color:var(--ink-4); }
.route-actions{ display:flex; gap:8px; }
.route-status{ font-size:12px; color:var(--ink-2); font-weight:600; padding:0 18px 12px; display:none; }
.route-status.show{ display:block; }
.route-status a{ color:var(--accent); font-weight:700; text-decoration:underline; text-underline-offset:2px; }

/* ---- Mobile tabs ---- */
.mtabs{ display:none; }
@media(max-width:880px){
  .mtabs{
    display:flex; flex-shrink:0; height:var(--tabs-h); border-bottom:1px solid var(--line);
    background:var(--bg); padding:8px 14px; gap:8px;
  }
  .mtabs button{
    flex:1; border:none; background:var(--bg-soft); border-radius:var(--r-pill); font-weight:700;
    font-size:13px; color:var(--ink-2); display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .mtabs button.active{ background:var(--ink); color:#fff; }
}

/* ---- Workspace ---- */
.workspace{ flex:1; display:flex; min-height:0; }
.pane-list{ width:380px; flex-shrink:0; border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; background:var(--bg); }
.pane-map{ flex:1; position:relative; min-height:0; background:var(--bg-soft); }
@media(max-width:880px){
  .workspace{ position:relative; }
  .pane-list, .pane-map{ width:100%; }
  .pane-list.hide, .pane-map.hide{ display:none; }
  .pane-list{ border-right:none; }
}

/* ---- Filters ---- */
.filters{ flex-shrink:0; padding:14px 16px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:10px; }
.search-box{
  display:flex; align-items:center; gap:9px; background:var(--bg-soft); border:1.5px solid transparent;
  border-radius:var(--r-pill); padding:10px 14px; transition:border-color .15s, background .15s;
}
.search-box:focus-within{ border-color:var(--accent); background:var(--bg); }
.search-box svg{ color:var(--ink-3); flex-shrink:0; }
.search-box input{ border:none; outline:none; background:none; font-size:13.5px; width:100%; color:var(--ink); }
.search-box input::placeholder{ color:var(--ink-3); }
.search-box .clear-x{ display:none; border:none; background:none; color:var(--ink-3); padding:2px; }
.search-box .clear-x.show{ display:flex; }

.seg{ display:flex; background:var(--bg-soft); border-radius:var(--r-pill); padding:3px; gap:2px; }
.seg button{
  flex:1; border:none; background:none; padding:8px 6px; border-radius:var(--r-pill);
  font-size:12.5px; font-weight:700; color:var(--ink-2); transition:all .15s var(--ease);
  display:flex; align-items:center; justify-content:center; gap:5px;
}
.seg button.active{ background:var(--ink); color:#fff; }
.seg button .cdot{ width:6px; height:6px; border-radius:50%; }

.filter-row{ display:flex; gap:8px; }
.selectwrap{ position:relative; flex:1; }
.selectwrap select{
  width:100%; appearance:none; -webkit-appearance:none; background:var(--bg); border:1.5px solid var(--line);
  border-radius:var(--r-sm); padding:9px 30px 9px 12px; font-size:12.5px; font-weight:700; color:var(--ink);
  cursor:pointer; transition:border-color .15s;
}
.selectwrap select:hover{ border-color:var(--ink-4); }
.selectwrap::after{
  content:''; position:absolute; right:11px; top:50%; width:8px; height:8px;
  border-right:1.6px solid var(--ink-3); border-bottom:1.6px solid var(--ink-3);
  transform:translateY(-65%) rotate(45deg); pointer-events:none;
}
.clear-all{ font-size:11.5px; font-weight:700; color:var(--ink-3); background:none; border:none; align-self:flex-start; text-decoration:underline; text-underline-offset:2px; }
.clear-all:hover{ color:var(--ink); }

/* ---- Result count ---- */
.result-bar{
  flex-shrink:0; padding:10px 16px; display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--line); font-size:12px; color:var(--ink-3); font-weight:700;
}
.result-bar b{ color:var(--ink); }
.legend{ display:flex; gap:10px; }
.legend span{ display:flex; align-items:center; gap:5px; }
.legend i{ width:7px; height:7px; border-radius:50%; display:inline-block; }
.legend .av{ background:var(--accent); } .legend .bu{ background:var(--amber); } .legend .of{ background:var(--ink-4); }

/* ---- Station list ---- */
.station-list{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.station-list::-webkit-scrollbar{ width:6px; }
.station-list::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }
.empty{ padding:60px 24px; text-align:center; color:var(--ink-3); }
.empty svg{ width:26px; height:26px; margin-bottom:10px; }
.empty div{ font-size:13px; font-weight:600; }

.s-card{ padding:14px 16px; border-bottom:1px solid var(--line-2); cursor:pointer; position:relative; transition:background .1s; }
.s-card:hover{ background:var(--bg-soft); }
.s-card.sel{ background:var(--accent-soft); }
.s-card.sel::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent); }
.s-top{ display:flex; align-items:flex-start; gap:8px; margin-bottom:6px; }
.s-badge{ width:8px; height:8px; border-radius:50%; margin-top:5px; flex-shrink:0; }
.s-badge.av{ background:var(--accent); } .s-badge.bu{ background:var(--amber); } .s-badge.of{ background:var(--ink-4); }
.s-name{ font-size:13.5px; font-weight:700; line-height:1.35; flex:1; }
.s-dist{ font-size:11px; font-weight:700; color:var(--ink-3); white-space:nowrap; }
.s-sub{ font-size:11.5px; color:var(--ink-3); margin-bottom:8px; display:flex; align-items:center; gap:5px; }
.s-tags{ display:flex; flex-wrap:wrap; gap:5px; }
.s-tag{ font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:6px; background:var(--grey-soft); color:var(--ink-2); }
.s-tag.fast{ background:var(--accent-soft); color:var(--accent); }
.s-tag.op{ background:transparent; border:1px solid var(--line); color:var(--ink-2); }

/* ---- Map ---- */
#map{ width:100%; height:100%; }
.leaflet-container{ font-family:'Inter',sans-serif; background:var(--bg-soft); }
.leaflet-control-attribution{ font-size:9px !important; }
.leaflet-control-zoom{ border:1px solid var(--line) !important; border-radius:var(--r-sm) !important; box-shadow:var(--sh-1) !important; overflow:hidden; }
.leaflet-control-zoom a{ background:#fff !important; color:var(--ink-2) !important; border-bottom:1px solid var(--line) !important; }
.leaflet-control-zoom a:hover{ background:var(--bg-soft) !important; }

.pin{ width:12px; height:12px; border-radius:50%; border:2.5px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.35); background:var(--accent); }
.pin.busy{ background:var(--amber); }
.pin.offline{ background:var(--ink-4); }
.pin.sel{ width:18px; height:18px; box-shadow:0 0 0 5px rgba(15,92,51,.16), 0 2px 6px rgba(0,0,0,.4); }
.pin-wrap{ display:flex; align-items:center; justify-content:center; }

.locate-btn{
  position:absolute; bottom:16px; right:16px; z-index:410;
  background:#fff; box-shadow:var(--sh-2);
}
@media(max-width:880px){ .locate-btn{ bottom:16px; } }

.route-line-badge{
  position:absolute; top:14px; left:14px; z-index:410; background:#fff; border:1px solid var(--line);
  border-radius:var(--r-pill); padding:8px 14px; font-size:12px; font-weight:700; color:var(--ink);
  box-shadow:var(--sh-1); display:none; align-items:center; gap:8px;
}
.route-line-badge.show{ display:flex; }
.route-line-badge b{ color:var(--accent); }

/* ---- Detail panel ---- */
.detail{
  position:absolute; z-index:500; background:#fff; box-shadow:var(--sh-2);
  display:none; flex-direction:column;
  top:0; right:0; bottom:0; width:340px; border-left:1px solid var(--line);
}
.detail.open{ display:flex; }
@media(max-width:880px){
  .detail{ top:auto; left:0; right:0; width:auto; border-left:none; border-top:1px solid var(--line);
    border-radius:var(--r-lg) var(--r-lg) 0 0; max-height:72%; }
  .detail.open{ animation:slideUp .22s var(--ease); }
}
@keyframes slideUp{ from{ transform:translateY(16px); opacity:.4; } to{ transform:translateY(0); opacity:1; } }

.detail-scroll{ overflow-y:auto; flex:1; }
.d-head{ padding:18px 18px 12px; border-bottom:1px solid var(--line); display:flex; gap:10px; }
.d-head-txt{ flex:1; min-width:0; }
.d-op{ font-size:10.5px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--accent); margin-bottom:5px; }
.d-name{ font-size:16px; font-weight:800; line-height:1.3; }
.d-close{ width:28px; height:28px; border-radius:50%; border:1px solid var(--line); background:var(--bg-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--ink-2); }
.d-close:hover{ background:var(--grey-soft); }
.d-addr{ padding:12px 18px; border-bottom:1px solid var(--line); font-size:12.5px; color:var(--ink-2); display:flex; gap:8px; }
.d-addr svg{ color:var(--ink-3); flex-shrink:0; margin-top:2px; }
.d-status{ padding:12px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; font-size:12px; font-weight:800; letter-spacing:.3px; text-transform:uppercase; }
.d-status i{ width:8px; height:8px; border-radius:50%; }
.d-grid{ display:grid; grid-template-columns:repeat(3,1fr); border-bottom:1px solid var(--line); }
.d-cell{ padding:14px 10px; text-align:center; border-right:1px solid var(--line); }
.d-cell:last-child{ border-right:none; }
.d-val{ font-size:19px; font-weight:800; }
.d-lbl{ font-size:9px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; color:var(--ink-3); margin-top:3px; }
.d-conn{ padding:14px 18px; border-bottom:1px solid var(--line); }
.d-conn-lbl{ font-size:10px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--ink-3); margin-bottom:8px; }
.d-conn-list{ display:flex; gap:6px; flex-wrap:wrap; }
.d-conn-item{ font-size:11.5px; font-weight:700; color:var(--accent); padding:5px 10px; border-radius:7px; background:var(--accent-soft); }
.d-hours{ padding:12px 18px; border-bottom:1px solid var(--line); font-size:12.5px; color:var(--ink-2); font-weight:600; display:flex; justify-content:space-between; }
.d-foot{ padding:14px 18px; }
.d-btn{ width:100%; display:flex; align-items:center; justify-content:center; gap:8px; background:var(--ink); color:#fff; border:none; padding:14px; border-radius:var(--r-sm); font-weight:800; font-size:13px; text-decoration:none; }
.d-btn:hover{ background:#000; }

/* ---- Toast ---- */
.toast-wrap{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:2000; display:flex; flex-direction:column; gap:8px; align-items:center; }
.toast{ background:var(--ink); color:#fff; padding:11px 18px; border-radius:var(--r-pill); font-size:12.5px; font-weight:600; box-shadow:var(--sh-2); animation:toastIn .2s var(--ease); }
.toast.error{ background:#7A2020; }
@keyframes toastIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
</style>
</head>
<body>

<script src="assets/js/site-chrome.js"></script>

<div class="app">

  <!-- MOBILE TABS -->
  <div class="mtabs">
    <button class="active" id="tabList"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>List</button>
    <button id="tabMap"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>Map</button>
  </div>

  <!-- WORKSPACE -->
  <div class="workspace">

    <aside class="pane-list" id="paneList">
      <div class="filters">
        <!-- PLAN A ROUTE ALWAYS SHOWN -->
        <div class="sidebar-route" style="display:flex; flex-direction:column; gap:8px; padding:12px; background:var(--bg-soft); border-radius:var(--r-md); border:1.5px solid var(--line);">
          <div style="font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-3); display:flex; align-items:center; gap:6px;">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="width:14px; height:14px;"><circle cx="6" cy="19" r="3"/><circle cx="18" cy="5" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/></svg>
            Plan a Route
          </div>
          <div style="display:flex; flex-direction:column; gap:6px;">
            <input type="text" id="routeFrom" placeholder="From (e.g. Kathmandu)" style="width:100%; padding:8px 10px; border:1.5px solid var(--line); border-radius:var(--r-sm); font-size:12px; outline:none; background:var(--bg); color:var(--ink);">
            <input type="text" id="routeTo" placeholder="To (e.g. Pokhara)" style="width:100%; padding:8px 10px; border:1.5px solid var(--line); border-radius:var(--r-sm); font-size:12px; outline:none; background:var(--bg); color:var(--ink);">
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn accent sm" id="btnFindRoute" style="flex:1; justify-content:center; font-size:12px; padding:6px 10px;">Find Stations</button>
            <button class="btn ghost sm" id="btnClearRoute" style="display:none; justify-content:center; border:1px solid var(--line); font-size:12px; padding:6px 10px;">Clear Route</button>
          </div>
          <div id="routeStatus" style="font-size:11px; color:var(--ink-2); display:none; line-height:1.4; margin-top:4px;"></div>
        </div>

        <div class="search-box">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" placeholder="Search by name, city or address">
          <button class="clear-x" id="searchClear"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
        <div class="seg" id="speedSeg">
          <button class="active" data-speed="all">All speeds</button>
          <button data-speed="DC Fast"><span class="cdot" style="background:#0F5C33"></span>Fast (DC)</button>
          <button data-speed="AC"><span class="cdot" style="background:#8B948E"></span>Slow (AC)</button>
        </div>
        <div class="filter-row">
          <div class="selectwrap">
            <select id="brandFilter"><option value="all">All brands</option></select>
          </div>
          <div class="selectwrap">
            <select id="provinceFilter"><option value="all">All provinces</option></select>
          </div>
        </div>
        <button class="clear-all" id="clearAll">Clear filters</button>
      </div>

      <div class="result-bar" style="display:flex; flex-direction:column; gap:4px; align-items:stretch;">
        <div style="display:flex; justify-content:space-between; font-size:13px;">
          <span><b id="countShown">0</b> stations shown</span>
          <span style="color:var(--ink-3); font-weight:600;"><span id="mAvail">—</span> available</span>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--ink-3); border-top:1px solid var(--line-2); padding-top:4px;">
          <span>Total: <b id="mTotal">—</b></span>

// ============================================================
// MAP SETUP — locked to Nepal only
// ============================================================
var NEPAL_BOUNDS = L.latLngBounds(L.latLng(26.35, 80.05), L.latLng(30.47, 88.20));

var map = L.map('map', {
  center:[28.35, 84.0], zoom:7, minZoom:6.6, maxZoom:18,
  zoomControl:false, maxBounds:NEPAL_BOUNDS.pad(0.06), maxBoundsViscosity:1.0, worldCopyJump:false
});
L.control.zoom({ position:'bottomleft' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'© OpenStreetMap', maxZoom:19, minZoom:6, noWrap:true
}).addTo(map);
map.fitBounds(NEPAL_BOUNDS, { padding:[6,6] });

var WORLD_RING = [[85,-360],[85,360],[-85,360],[-85,-360]];
L.polygon([WORLD_RING, NEPAL_BOUNDARY_COORDS], { stroke:false, fillColor:'#F6F7F5', fillOpacity:.94, interactive:false }).addTo(map);
L.polygon(NEPAL_BOUNDARY_COORDS, { color:'#0F5C33', weight:1.4, opacity:.4, fill:false, interactive:false }).addTo(map);

var markers = {};
var activeNet = 'all', activeSpeed = 'all', activeProvince = 'all', searchQ = '';
var selectedId = null, activeRouteCoords = null, routePolyline = null;

function distanceKm(lat1, lon1, lat2, lon2){
  var R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
  var a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function isNearRoute(s, coords, maxKm){
  for (var i=0;i<coords.length;i+=2){ if (distanceKm(s.lat,s.lng,coords[i][1],coords[i][0]) <= maxKm) return true; }
  return false;
}

function makeIcon(s){
  var cls = s.status === 'busy' ? 'busy' : s.status === 'offline' ? 'offline' : '';
  var sel = selectedId === s.id ? ' sel' : '';
  return L.divIcon({ className:'pin-wrap', html:'<div class="pin '+cls+sel+'"></div>', iconSize:[14,14], iconAnchor:[7,7] });
}
function uniqueSorted(arr){ return Array.from(new Set(arr.filter(Boolean))).sort(); }

function buildStaticFilters(){
  var counts = {};
  STATIONS.forEach(function(s){ counts[s.operator] = (counts[s.operator]||0)+1; });
  var networks = Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a]; });
  var brandSel = document.getElementById('brandFilter');
  brandSel.innerHTML = '<option value="all">All brands</option>' + networks.map(function(n){
    return '<option value="'+n+'">'+(n||'Unlisted')+' ('+counts[n]+')</option>';
  }).join('');

  var provinces = uniqueSorted(STATIONS.map(function(s){ return s.province; }));
  var provSel = document.getElementById('provinceFilter');
  provSel.innerHTML = '<option value="all">All provinces</option>' + provinces.map(function(p){
    return '<option value="'+p+'">'+p+'</option>';
  }).join('');

  document.getElementById('mTotal').textContent = STATIONS.length;
  document.getElementById('mNetworks').textContent = networks.length;
}

function renderList(filtered){
  var el = document.getElementById('stationList');
  if (!filtered.length){
    el.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><div>No stations match your filters</div></div>';
    return;
  }
  el.innerHTML = filtered.map(function(s){
    var statusCls = s.status === 'available' ? 'av' : s.status === 'busy' ? 'bu' : 'of';
    var speedTag = s.type === 'DC Fast' ? '<span class="s-tag fast">'+s.power+' kW · Fast</span>' : '<span class="s-tag">'+ (s.power ? s.power+' kW · Slow' : 'Slow') +'</span>';
    var dist = activeRouteCoords ? '' : '';
    return '<div class="s-card" data-id="'+s.id+'">'+
      '<div class="s-top"><div class="s-badge '+statusCls+'"></div><div class="s-name">'+s.name+'</div></div>'+
      '<div class="s-sub"><svg class="icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>'+s.city+'</div>'+
      '<div class="s-tags">'+speedTag+'<span class="s-tag op">'+(s.operator||'Unlisted')+'</span></div>'+
    '</div>';
  }).join('');
  el.querySelectorAll('.s-card').forEach(function(item){
    item.addEventListener('click', function(){
      var s = STATIONS.find(function(x){ return x.id === Number(item.dataset.id); });
      selectStation(s);
    });
  });
}

function updateCounts(filtered){
  var av = filtered.filter(function(s){ return s.status==='available'; }).length;
  document.getElementById('countShown').textContent = filtered.length;
  document.getElementById('mAvail').textContent = av;
}

function applyFilters(){
  var filtered = STATIONS.filter(function(s){
    var netOk = activeNet === 'all' || s.operator === activeNet;
    var speedOk = activeSpeed === 'all' || s.type === activeSpeed;
    var provOk = activeProvince === 'all' || s.province === activeProvince;
    var q = searchQ;
    var srchOk = !q || s.name.toLowerCase().indexOf(q) > -1 || s.city.toLowerCase().indexOf(q) > -1 ||
                 s.address.toLowerCase().indexOf(q) > -1 || (s.operator||'').toLowerCase().indexOf(q) > -1;
    var routeOk = !activeRouteCoords || isNearRoute(s, activeRouteCoords, 15);
    return netOk && speedOk && provOk && srchOk && routeOk;
  });

  Object.keys(markers).forEach(function(k){ map.removeLayer(markers[k]); });
  markers = {};
  filtered.forEach(function(s){
    var m = L.marker([s.lat, s.lng], { icon: makeIcon(s) }).addTo(map);
    m.on('click', function(){ selectStation(s); });
    markers[s.id] = m;
  });

  renderList(filtered);
  updateCounts(filtered);
}

function selectStation(s){
  selectedId = s.id;
  applyFilters();

  document.getElementById('dOp').textContent = (s.operator || 'Unlisted') + ' Network';
  document.getElementById('dName').textContent = s.name;
  document.getElementById('dAddr').textContent = s.address + ', ' + s.city;

  var dot = document.getElementById('dDot'), txt = document.getElementById('dStatusTxt');
  if (s.status === 'available'){ dot.style.background = '#0F5C33'; txt.style.color = '#0F5C33'; txt.textContent = 'Available now'; }
  else if (s.status === 'busy'){ dot.style.background = '#A66A0E'; txt.style.color = '#A66A0E'; txt.textContent = 'In use'; }
  else { dot.style.background = '#B7BEB9'; txt.style.color = '#8B948E'; txt.textContent = 'Offline'; }

  document.getElementById('dPower').textContent = s.power || '—';
  document.getElementById('dGuns').textContent = s.guns;
  document.getElementById('dRate').textContent = s.rate;
  document.getElementById('dConns').innerHTML = s.plugs.map(function(p){ return '<div class="d-conn-item">'+p+'</div>'; }).join('');
  document.getElementById('dHours').textContent = s.hours;
  document.getElementById('dOpen').textContent = s.hours === '00:00–24:00' ? '24/7' : '';
  document.getElementById('dDir').href = 'https://www.google.com/maps/dir/?api=1&destination='+s.lat+','+s.lng+'&travelmode=driving';

  document.getElementById('detail').classList.add('open');
  map.setView([s.lat, s.lng], 14, { animate:true });

  if (window.innerWidth <= 880) switchTab('map');
}
document.getElementById('dClose').addEventListener('click', function(){
  document.getElementById('detail').classList.remove('open');
  selectedId = null; applyFilters();
});

document.getElementById('brandFilter').addEventListener('change', function(e){ activeNet = e.target.value; applyFilters(); });
document.getElementById('provinceFilter').addEventListener('change', function(e){ activeProvince = e.target.value; applyFilters(); });

document.getElementById('speedSeg').addEventListener('click', function(e){
  var btn = e.target.closest('button'); if (!btn) return;
  activeSpeed = btn.dataset.speed;
  document.querySelectorAll('#speedSeg button').forEach(function(b){ b.classList.toggle('active', b === btn); });
  applyFilters();
});

var searchInput = document.getElementById('searchInput');
var searchClear = document.getElementById('searchClear');
searchInput.addEventListener('input', function(e){
  searchQ = e.target.value.toLowerCase().trim();
  searchClear.classList.toggle('show', !!searchQ);
  applyFilters();
});
searchClear.addEventListener('click', function(){ searchInput.value=''; searchQ=''; searchClear.classList.remove('show'); applyFilters(); searchInput.focus(); });

document.getElementById('clearAll').addEventListener('click', function(){
  activeNet='all'; activeSpeed='all'; activeProvince='all'; searchQ='';
  document.getElementById('brandFilter').value='all';
  document.getElementById('provinceFilter').value='all';
  document.querySelectorAll('#speedSeg button').forEach(function(b,i){ b.classList.toggle('active', i===0); });
  searchInput.value=''; searchClear.classList.remove('show');
  applyFilters();
});

// ---- Locate me ----
document.getElementById('locateBtn').addEventListener('click', function(){
  if (!navigator.geolocation) return toast('Location is not available on this device.', 'error');
  var btn = this; var orig = btn.innerHTML;
  btn.innerHTML = 'Locating…';
  navigator.geolocation.getCurrentPosition(function(pos){
    var latlng = [pos.coords.latitude, pos.coords.longitude];
    if (NEPAL_BOUNDS.contains(latlng)) map.setView(latlng, 13); else map.fitBounds(NEPAL_BOUNDS);
    btn.innerHTML = orig; lucide.createIcons();
  }, function(){ toast('Could not get your location.', 'error'); btn.innerHTML = orig; lucide.createIcons(); });
});

// ---- Route planner ----

async function geocode(query){
  try{
    var res = await fetch('https://nominatim.openstreetmap.org/search?format=json&countrycodes=np&limit=1&q='+encodeURIComponent(query));
    var data = await res.json();
    if (data && data.length) return [parseFloat(data[0].lon), parseFloat(data[0].lat)];
  }catch(e){}
  return null;
}

document.getElementById('btnFindRoute').addEventListener('click', async function(){
  var fromVal = document.getElementById('routeFrom').value.trim();
  var toVal = document.getElementById('routeTo').value.trim();
  var statusEl = document.getElementById('routeStatus');
  if (!fromVal || !toVal){ toast('Enter both a starting point and a destination.', 'error'); return; }

  var btn = this; var orig = btn.textContent;
  btn.textContent = 'Finding route…'; btn.disabled = true;

  var fromCoords = await geocode(fromVal);
  var toCoords = await geocode(toVal);
  if (!fromCoords || !toCoords){
    toast('Could not find one of those places in Nepal.', 'error');
    btn.textContent = orig; btn.disabled = false; return;
  }

  try{
    var url = 'https://router.project-osrm.org/route/v1/driving/'+fromCoords[0]+','+fromCoords[1]+';'+toCoords[0]+','+toCoords[1]+'?overview=full&geometries=geojson';
    var res = await fetch(url);
    var data = await res.json();
    if (data.routes && data.routes.length){
      activeRouteCoords = data.routes[0].geometry.coordinates;
      if (routePolyline) map.removeLayer(routePolyline);
      var latlngs = activeRouteCoords.map(function(c){ return [c[1], c[0]]; });
      routePolyline = L.polyline(latlngs, { color:'#0F5C33', weight:4, opacity:.85 }).addTo(map);
      map.fitBounds(routePolyline.getBounds(), { padding:[30,30] });
      applyFilters();
      document.getElementById('btnClearRoute').style.display = 'inline-flex';
      var km = (data.routes[0].distance/1000).toFixed(0);
      statusEl.innerHTML = 'Route found — <b>'+km+' km</b>. Showing stations within 15 km of your path.';
      statusEl.classList.add('show');
      document.getElementById('routeBadge').classList.add('show');
      document.getElementById('routeBadgeTxt').textContent = fromVal + ' → ' + toVal + ' · ' + km + ' km';
      if (window.innerWidth <= 880) switchTab('map');
    } else {
      toast('Could not calculate a driving route between these places.', 'error');
    }
  }catch(e){ toast('Route lookup failed. Check your connection and try again.', 'error'); }

  btn.textContent = orig; btn.disabled = false;
});

document.getElementById('btnClearRoute').addEventListener('click', function(){
  activeRouteCoords = null;
  document.getElementById('routeFrom').value = '';
  document.getElementById('routeTo').value = '';
  document.getElementById('routeStatus').classList.remove('show');
  document.getElementById('routeBadge').classList.remove('show');
  this.style.display = 'none';
  if (routePolyline){ map.removeLayer(routePolyline); routePolyline = null; }
  map.fitBounds(NEPAL_BOUNDS, { padding:[6,6] });
  applyFilters();
});

// ---- Mobile tabs ----
function switchTab(which){
  var listOn = which === 'list';
  document.getElementById('tabList').classList.toggle('active', listOn);
  document.getElementById('tabMap').classList.toggle('active', !listOn);
  document.getElementById('paneList').classList.toggle('hide', !listOn);
  document.getElementById('paneMap').classList.toggle('hide', listOn);
  if (!listOn) setTimeout(function(){ map.invalidateSize(); }, 150);
}
document.getElementById('tabList').addEventListener('click', function(){ switchTab('list'); });
document.getElementById('tabMap').addEventListener('click', function(){ switchTab('map'); });

buildStaticFilters();
applyFilters();

window.addEventListener('resize', function(){ map.invalidateSize(); });
</script>
