name: Publish website to cPanel

# Disabled as an automatic trigger: the live site runs as a cPanel Node.js app
# from ~/repositories/autoviindu-car (pulled via git), NOT from the FTP'd copy in
# /public_html/. Auto-FTP on every push overwrote the Passenger .htaccess and
# shipped a Linux-built better-sqlite3 binary that won't run on the host.
# Deploy is now: git pull + npm install + npm run generate on the server.
# Left here as a manual-only fallback.
on:
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Remove dev-only dependencies
        # prisma is an optional peer dep of @prisma/client, so `npm prune --omit=dev`
        # won't drop it (or its own heavy deps) even though it's devDependencies-only here.
        run: |
          npm prune --omit=dev
          rm -rf node_modules/prisma node_modules/.bin/prisma \
                 node_modules/@prisma/studio-core node_modules/@prisma/dev \
                 node_modules/@prisma/engines node_modules/@prisma/config \
                 node_modules/@prisma/query-plan-executor node_modules/@prisma/fetch-engine \
                 node_modules/@prisma/streams-local node_modules/@prisma/get-platform \
                 node_modules/effect

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
